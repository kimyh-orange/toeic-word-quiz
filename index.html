<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b82c4">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>토익 단어 테스트</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#27313f;--sub:#6b7686;--line:#e3e8ef;--pri:#3b82c4;--pri-d:#2c68a3;--ok:#2e9e6b;--okbg:#e6f6ee;--no:#d9534f;--nobg:#fdecec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--sub);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(30,50,80,.05)}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0 18px}
.days button{padding:10px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px;cursor:pointer;color:var(--ink)}
.days button:hover{border-color:var(--pri)}
.days button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.row{display:flex;gap:8px;margin-bottom:18px}
.row label{flex:1;cursor:pointer}
.row input{position:absolute;opacity:0;pointer-events:none}
.row span{display:block;text-align:center;padding:11px 4px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
.row input:checked+span{color:var(--pri-d);font-weight:700;border-color:var(--pri);background:#eef5fc}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:16px;cursor:pointer}
.btn:hover{background:var(--pri-d)}
.btn.ghost{background:#fff;color:var(--pri-d);border:1px solid var(--pri);margin-top:10px}
.btn.ghost:hover{background:#f3f8fd}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}
.q{font-size:30px;font-weight:700;text-align:center;margin:10px 0 24px;word-break:keep-all}
.q.ko{font-size:22px}
.opts{display:grid;gap:10px}
.opt{padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--pri);background:#f3f8fd}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt:disabled{cursor:default}
.score{font-size:46px;font-weight:700;text-align:center;color:var(--pri-d);margin:6px 0}
.wrong{margin:16px 0;padding:0;list-style:none;font-size:15px}
.wrong li{padding:8px 0;border-bottom:1px solid var(--line)}
.wrong b{margin-right:8px}
.star{display:block;margin:12px auto 0;padding:8px 16px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--sub);font-size:14px;cursor:pointer}
.star.on{background:#fff8e1;border-color:#f2b705;color:#9a6b00}
.tag{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:10px;font-size:12px}
.tag.no{background:var(--nobg);color:var(--no)}
.tag.st{background:#fff8e1;color:#9a6b00}
.hide{display:none}
@media(max-width:480px){
main{padding:16px 12px 40px}
h1{font-size:20px}
.card{padding:16px 14px}
.days{grid-template-columns:repeat(5,1fr);gap:6px}
.days button{padding:12px 0;font-size:16px}
.q{font-size:26px;margin:6px 0 18px}
.q.ko{font-size:20px}
.opt{padding:15px 12px;font-size:16px}
.btn{padding:15px;font-size:17px}
.score{font-size:38px}
}
</style>
</head>
<body>
<main>
<h1>토익 단어 테스트</h1>
<p class="sub">Day를 고르면 해당 Day 단어를 무작위 순서로 퀴즈로 풉니다.</p>

<section id="home" class="card">
  <b>Day 선택</b>
  <div class="days" id="days"></div>
  <div class="row">
    <label><input type="radio" name="dir" value="en" checked><span>영어 → 뜻</span></label>
    <label><input type="radio" name="dir" value="ko"><span>뜻 → 영어</span></label>
  </div>
  <button class="btn" id="start">시작하기</button>
</section>

<section id="quiz" class="card hide">
  <div class="top"><span id="tag"></span><span id="cnt"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
  <button class="star" id="star">☆ 다시 볼래요</button>
  <button class="btn ghost hide" id="next">다음</button>
</section>

<section id="result" class="card hide">
  <div class="top"><span id="rtag"></span></div>
  <div class="score" id="score"></div>
  <b id="wtitle"></b>
  <ul class="wrong" id="wrong"></ul>
  <button class="btn hide" id="retry">오답·체크한 단어만 다시 풀기</button>
  <button class="btn ghost" id="again">같은 Day 다시 풀기</button>
  <button class="btn ghost" id="back">Day 다시 고르기</button>
</section>
</main>

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
let review = [], day = 1, dir = 'en', pool = [], list = [], idx = 0, miss = [], correct = 0, marked = new Set();

for (let d = 1; d <= 30; d++) {
  const b = document.createElement('button'); b.textContent = d;
  b.onclick = () => { day = d; mark(); };
  $('days').appendChild(b);
}
const mark = () => [...$('days').children].forEach((b, i) => b.classList.toggle('on', i + 1 === day));
mark();
const show = id => ['home', 'quiz', 'result'].forEach(s => $(s).classList.toggle('hide', s !== id));

function begin(words) {
  dir = document.querySelector('input[name=dir]:checked').value;
  list = shuffle(words); idx = 0; miss = []; correct = 0; marked = new Set();
  show('quiz'); ask();
}
function ask() {
  const cur = list[idx], isEn = dir === 'en';
  $('tag').textContent = 'Day ' + day;
  $('cnt').textContent = (idx + 1) + ' / ' + list.length;
  $('bar').style.width = (idx / list.length * 100) + '%';
  $('q').textContent = isEn ? cur[0] : cur[1];
  $('q').classList.toggle('ko', !isEn);
  $('next').classList.add('hide');
  setStar();
  const others = shuffle(pool.filter(p => p !== cur)).slice(0, 3);
  $('opts').innerHTML = '';
  shuffle([cur, ...others]).forEach(o => {
    const b = document.createElement('button'); b.className = 'opt';
    b.textContent = isEn ? o[1] : o[0];
    b.dataset.ans = o === cur ? '1' : '';
    b.onclick = () => pick(b, o === cur);
    $('opts').appendChild(b);
  });
}
function setStar() {
  const on = marked.has(list[idx]);
  $('star').classList.toggle('on', on);
  $('star').textContent = (on ? '★' : '☆') + ' 다시 볼래요';
}
$('star').onclick = () => { const c = list[idx]; marked.has(c) ? marked.delete(c) : marked.add(c); setStar(); };
function pick(btn, ok) {
  [...$('opts').children].forEach(b => { b.disabled = true; if (b.dataset.ans) b.classList.add('ok'); });
  if (ok) correct++; else { btn.classList.add('no'); miss.push(list[idx]); }
  $('next').textContent = idx + 1 < list.length ? '다음' : '결과 보기';
  $('next').classList.remove('hide');
  $('next').focus();
}
$('next').onclick = () => { idx++; idx < list.length ? ask() : finish(); };
function finish() {
  $('bar').style.width = '100%';
  $('rtag').textContent = 'Day ' + day + ' 결과';
  $('score').textContent = correct + ' / ' + list.length;
  review = list.filter(c => miss.includes(c) || marked.has(c));
  $('wtitle').textContent = review.length ? '오답노트 (' + review.length + '개)' : '';
  $('wrong').innerHTML = '';
  review.forEach(([w, m]) => {
    const li = document.createElement('li'), b = document.createElement('b');
    const item = [w, m];
    if (miss.some(c => c[0] === w)) { const t = document.createElement('span'); t.className = 'tag no'; t.textContent = '오답'; li.append(t); }
    if (marked.has(list.find(c => c[0] === w))) { const t = document.createElement('span'); t.className = 'tag st'; t.textContent = '★'; li.append(t); }
    b.textContent = w; li.append(b, m); $('wrong').appendChild(li);
  });
  $('retry').classList.toggle('hide', !review.length);
  show('result');
}
$('start').onclick = () => { pool = DAYS[day - 1]; begin(pool); };
$('retry').onclick = () => begin(review);   // 보기는 해당 Day 전체에서 뽑는다
$('again').onclick = () => begin(pool);
$('back').onclick = () => show('home');
document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hide')) return;
  if (e.key >= '1' && e.key <= '4') { const b = $('opts').children[e.key - 1]; if (b && !b.disabled) b.click(); }
  else if (e.key === 'Enter' && !$('next').classList.contains('hide')) $('next').click();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
