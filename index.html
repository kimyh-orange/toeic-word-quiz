<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b82c4">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>토익 단어 테스트</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#27313f;--sub:#6b7686;--line:#e3e8ef;--pri:#3b82c4;--pri-d:#2c68a3;--ok:#2e9e6b;--okbg:#e6f6ee;--no:#d9534f;--nobg:#fdecec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--sub);font-size:14px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(30,50,80,.05)}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0 18px}
.days button{padding:10px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px;cursor:pointer;color:var(--ink)}
.days button:hover{border-color:var(--pri)}
.days button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.row label{flex:1 1 30%;cursor:pointer}
.row input{position:absolute;opacity:0;pointer-events:none}
.row span{display:block;text-align:center;padding:11px 4px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
.row input:checked+span{color:var(--pri-d);font-weight:700;border-color:var(--pri);background:#eef5fc}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:16px;cursor:pointer}
.btn:hover{background:var(--pri-d)}
.btn.ghost{background:#fff;color:var(--pri-d);border:1px solid var(--pri);margin-top:10px}
.btn.ghost:hover{background:#f3f8fd}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}
.q{font-size:30px;font-weight:700;text-align:center;margin:10px 0 24px;word-break:keep-all}
.q.ko{font-size:22px}
.opts{display:grid;gap:10px}
.opt{padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--pri);background:#f3f8fd}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt:disabled{cursor:default}
.score{font-size:46px;font-weight:700;text-align:center;color:var(--pri-d);margin:6px 0}
.wrong{margin:16px 0;padding:0;list-style:none;font-size:15px}
.wrong li{padding:8px 0;border-bottom:1px solid var(--line)}
.wrong b{margin-right:8px}
.star{display:block;margin:12px auto 0;padding:8px 16px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--sub);font-size:14px;cursor:pointer}
.star.on{background:#fff8e1;border-color:#f2b705;color:#9a6b00}
.tag{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:10px;font-size:12px}
.tag.no{background:var(--nobg);color:var(--no)}
.tag.st{background:#fff8e1;color:#9a6b00}
.wrong li{display:flex;align-items:center;gap:6px}
.wrong li .x{margin-left:auto;border:0;background:none;color:var(--sub);font-size:18px;cursor:pointer;padding:0 6px}
.qwrap{text-align:center;margin:6px 0 20px}
.qwrap .q{margin:6px 0 0}
.posb{display:inline-block;padding:2px 12px;border-radius:12px;background:#eef5fc;color:var(--pri-d);font-size:13px}
.fb{min-height:22px;margin-top:14px;text-align:center;font-size:15px;color:var(--sub)}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
#ans{width:100%;padding:14px;font-size:20px;text-align:center;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
#ans.ok{border-color:var(--ok);background:var(--okbg)}#ans.no{border-color:var(--no);background:var(--nobg)}
.hint{text-align:center;color:var(--sub);font-size:13px;margin:6px 0 10px;min-height:18px}
.nav{display:flex;gap:8px}.nav .btn{flex:1}
.exit{border:0;background:none;color:var(--sub);font-size:14px;cursor:pointer;padding:0}
.exit:hover{color:var(--no)}
.hide{display:none}
@media(max-width:480px){
main{padding:16px 12px 40px}
h1{font-size:20px}
.card{padding:16px 14px}
.days{grid-template-columns:repeat(5,1fr);gap:6px}
.days button{padding:12px 0;font-size:16px}
.q{font-size:26px;margin:6px 0 18px}
.q.ko{font-size:20px}
.opt{padding:15px 12px;font-size:16px}
.btn{padding:15px;font-size:17px}
.score{font-size:38px}
}
</style>
</head>
<body>
<main>
<h1>토익 단어 테스트</h1>
<p class="sub">Day를 고르면 해당 Day 단어를 무작위 순서로 퀴즈로 풉니다.</p>

<section id="home" class="card">
  <b>Day 선택</b>
  <div class="days" id="days"></div>
  <div class="row">
    <label><input type="radio" name="dir" value="en" checked><span>영어 → 뜻</span></label>
    <label><input type="radio" name="dir" value="ko"><span>뜻 → 영어</span></label>
    <label><input type="radio" name="dir" value="type"><span>뜻 → 영어 쓰기</span></label>
  </div>
  <button class="btn" id="start">시작하기</button>
  <button class="btn ghost" id="notebtn"></button>
</section>

<section id="notes" class="card hide">
  <b id="ntitle"></b>
  <ul class="wrong" id="nlist"></ul>
  <button class="btn" id="nquiz">오답노트 퀴즈 시작</button>
  <button class="btn ghost" id="nback">처음으로</button>
</section>

<section id="quiz" class="card hide">
  <div class="top"><button class="exit" id="exit">✕ 나가기</button><span><span id="tag"></span> · <span id="cnt"></span></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="qwrap"><span class="posb" id="pos"></span><div class="q" id="q"></div></div>
  <div class="opts" id="opts"></div>
  <div id="typebox" class="hide">
    <input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어 단어를 입력하세요">
    <div class="hint" id="hint"></div>
    <button class="btn" id="chk">확인</button>
  </div>
  <div class="fb" id="fb"></div>
  <button class="star" id="star">☆ 다시 볼래요</button>
  <div class="nav"><button class="btn ghost hide" id="prev">← 이전</button><button class="btn ghost hide" id="next">다음</button></div>
</section>

<section id="result" class="card hide">
  <div class="top"><span id="rtag"></span></div>
  <div class="score" id="score"></div>
  <b id="wtitle"></b>
  <ul class="wrong" id="wrong"></ul>
  <button class="btn hide" id="retry">오답·체크한 단어만 다시 풀기</button>
  <button class="btn ghost" id="again">처음부터 다시 풀기</button>
  <button class="btn ghost" id="back">Day 다시 고르기</button>
</section>
</main>

const $ = id => document.getElementById(id);
const POS = { 명: '명사', 동: '동사', 형: '형용사', 부: '부사', 표: '표현' };
const KEY = 'toeic-notes';
const loadNotes = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
const saveNotes = n => { try { localStorage.setItem(KEY, JSON.stringify(n)); } catch (e) {} };
const dayOf = c => DAYS.findIndex(L => L.includes(c)) + 1;

const refreshHome = () => { $('notebtn').textContent = '오답노트 (' + loadNotes().length + '개)'; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
let base = [], review = [], title = '', day = 1, dir = 'en', pool = [], list = [], Q = [], idx = 0, miss = [], marked = new Set();

for (let d = 1; d <= 30; d++) {
  const b = document.createElement('button'); b.textContent = d;
  b.onclick = () => { day = d; mark(); };
  $('days').appendChild(b);
}
const mark = () => [...$('days').children].forEach((b, i) => b.classList.toggle('on', i + 1 === day));
mark(); refreshHome();
const show = id => ['home', 'quiz', 'result', 'notes'].forEach(s => $(s).classList.toggle('hide', s !== id));

// 보기 만들기: 같은 품사에서, 뜻이 겹치지 않는 단어 중 철자가 비슷한 것을 우선 고른다
const senses = m => new Set(m.replace(/\([^)]*\)/g, '').split(/[,;]/).map(x => x.trim()).filter(Boolean));
const bigrams = w => { w = w.toLowerCase().replace(/[^a-z]/g, ''); const s = new Set(); for (let i = 0; i < w.length - 1; i++) s.add(w.slice(i, i + 2)); return s; };
const sim = (a, b) => { const x = bigrams(a), y = bigrams(b); let n = 0; x.forEach(g => y.has(g) && n++); return n / (x.size + y.size - n || 1); };
function makeOpts(cur) {
  const cs = senses(cur[1]);
  const ok = c => c !== cur && c[0] !== cur[0] && ![...senses(c[1])].some(s => cs.has(s));
  let cand = pool.filter(c => c[2] === cur[2] && ok(c));
  if (cand.length < 8) cand = cand.concat(shuffle(DAYS.flat().filter(c => c[2] === cur[2] && ok(c) && !cand.includes(c))).slice(0, 40));
  if (cand.length < 4) cand = cand.concat(shuffle(pool.filter(c => ok(c) && !cand.includes(c))));
  const top = cand.map(c => [sim(cur[0], c[0]) + Math.random() * .3, c]).sort((a, b) => b[0] - a[0]).slice(0, 4).map(x => x[1]);
  return shuffle([cur, ...top]);
}
const norm = t => String(t).toLowerCase().replace(/\s+/g, ' ').trim();
const isRight = (q, cur) => dir === 'type' ? norm(q.picked) === norm(cur[0]) : q.picked === cur;

function begin(words) {
  dir = document.querySelector('input[name=dir]:checked').value;
  list = shuffle(words); Q = []; idx = 0; miss = []; marked = new Set();
  show('quiz'); ask();
}
function ask() {
  const cur = list[idx];
  if (!Q[idx]) Q[idx] = { opts: dir === 'type' ? null : makeOpts(cur), picked: null };
  $('tag').textContent = title;
  $('cnt').textContent = (idx + 1) + ' / ' + list.length;
  $('bar').style.width = (idx / list.length * 100) + '%';
  $('pos').textContent = POS[cur[2]];
  $('q').textContent = dir === 'en' ? cur[0] : cur[1];
  $('q').classList.toggle('ko', dir !== 'en');
  $('prev').classList.toggle('hide', idx === 0);
  render();
}
function render() {
  const cur = list[idx], q = Q[idx], done = q.picked !== null;
  setStar();
  $('opts').innerHTML = '';
  $('typebox').classList.toggle('hide', dir !== 'type');
  if (dir === 'type') {
    $('ans').value = done ? q.picked : ''; $('ans').disabled = done;
    $('chk').classList.toggle('hide', done);
    $('ans').classList.toggle('ok', done && isRight(q, cur));
    $('ans').classList.toggle('no', done && !isRight(q, cur));
    $('hint').textContent = done ? '' : '힌트: ' + cur[0].length + '글자';
    if (!done) $('ans').focus();
  } else {
    q.opts.forEach((o, i) => {
      const b = document.createElement('button'); b.className = 'opt';
      b.textContent = (dir === 'en' ? o[1] : o[0]);
      if (done) { b.disabled = true; if (o === cur) b.classList.add('ok'); else if (o === q.picked) b.classList.add('no'); }
      else b.onclick = () => { q.picked = o; render(); };
      $('opts').appendChild(b);
    });
  }
  $('fb').textContent = done ? (isRight(q, cur) ? '정답  ' : '오답  ') + cur[0] + '  ' + cur[1] : '';
  $('fb').className = 'fb' + (done ? (isRight(q, cur) ? ' ok' : ' no') : '');
  $('next').classList.toggle('hide', !done);
  $('next').textContent = idx + 1 < list.length ? '다음' : '결과 보기';
}
function check() {
  const v = $('ans').value.trim(); if (!v) return;
  Q[idx].picked = v; render(); $('next').focus();
}
$('chk').onclick = check;
$('ans').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); check(); } };
function setStar() {
  const on = marked.has(list[idx]);
  $('star').classList.toggle('on', on);
  $('star').textContent = (on ? '★' : '☆') + ' 다시 볼래요';
}
$('star').onclick = () => { const c = list[idx]; marked.has(c) ? marked.delete(c) : marked.add(c); setStar(); };
$('prev').onclick = () => { idx--; ask(); };
$('next').onclick = () => { idx++; idx < list.length ? ask() : finish(); };
function finish() {
  miss = list.filter((c, i) => !isRight(Q[i], c));
  $('bar').style.width = '100%';
  $('rtag').textContent = title + ' 결과';
  $('score').textContent = (list.length - miss.length) + ' / ' + list.length;
  review = list.filter(c => miss.includes(c) || marked.has(c));
  const saved = loadNotes();
  review.forEach(c => { const d = dayOf(c); if (!saved.some(x => x[0] === d && x[1] === c[0])) saved.push([d, c[0]]); });
  saveNotes(saved); refreshHome();
  $('wtitle').textContent = review.length ? '오답노트 (' + review.length + '개)' : '';
  $('wrong').innerHTML = '';
  review.forEach(c => {
    const li = document.createElement('li'), b = document.createElement('b');
    if (miss.includes(c)) { const t = document.createElement('span'); t.className = 'tag no'; t.textContent = '오답'; li.append(t); }
    if (marked.has(c)) { const t = document.createElement('span'); t.className = 'tag st'; t.textContent = '★'; li.append(t); }
    b.textContent = c[0]; li.append(b, c[1]); $('wrong').appendChild(li);
  });
  $('retry').classList.toggle('hide', !review.length);
  show('result');
}
$('start').onclick = () => { pool = DAYS[day - 1]; title = 'Day ' + day; base = pool; begin(base); };
$('retry').onclick = () => begin(review);
$('again').onclick = () => begin(base);
$('exit').onclick = () => { if (confirm('퀴즈를 나갈까요? 이번 퀴즈의 기록은 저장되지 않습니다.')) { refreshHome(); show('home'); } };
$('back').onclick = () => { refreshHome(); show('home'); };
function showNotes() {
  const n = loadNotes();
  $('ntitle').textContent = '오답노트 (' + n.length + '개)';
  $('nlist').innerHTML = '';
  n.forEach(([d, w], i) => {
    const it = DAYS[d - 1].find(x => x[0] === w); if (!it) return;
    const li = document.createElement('li'), t = document.createElement('span'), b = document.createElement('b'), x = document.createElement('button');
    t.className = 'tag st'; t.textContent = 'Day ' + d; b.textContent = w;
    x.className = 'x'; x.textContent = '✕'; x.title = '삭제';
    x.onclick = () => { const a = loadNotes(); a.splice(i, 1); saveNotes(a); showNotes(); };
    li.append(t, b, it[1], x); $('nlist').appendChild(li);
  });
  $('nquiz').classList.toggle('hide', n.length < 1);
  show('notes');
}
$('notebtn').onclick = showNotes;
$('nback').onclick = () => { refreshHome(); show('home'); };
$('nquiz').onclick = () => { pool = DAYS.flat(); title = '오답노트'; base = noteItems(); begin(base); };
document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hide') || e.target.tagName === 'INPUT') return;
  if (e.key >= '1' && e.key <= '5') { const b = $('opts').children[e.key - 1]; if (b && !b.disabled) b.click(); }
  else if (e.key === 'Enter' && !$('next').classList.contains('hide')) $('next').click();
  else if (e.key === 'ArrowLeft' && idx > 0) $('prev').click();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
